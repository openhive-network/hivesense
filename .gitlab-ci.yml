stages:
- detect
- lint
- build
- sync
- test
- publish
- cleanup

variables:
  # Variables required by Common CI jobs
  CI_COMMON_JOB_VERSION: "6b9e9e75ec5263939450936a4f8348dfbca3666d"
  DOCKER_BUILDER_TAG: "$CI_COMMON_JOB_VERSION"
  DOCKER_DIND_TAG: "$CI_COMMON_JOB_VERSION"
  IMAGE_REMOVER_TAG: "$CI_COMMON_JOB_VERSION"
  # Git configuration
  # Fetch strategy reuses workspace between jobs, reducing GitLab server load.
  # Full clone (depth 0) enables efficient incremental fetches - shallow clones
  # don't reduce server CPU and make fetch less effective.
  GIT_STRATEGY: fetch
  GIT_DEPTH: 0
  GIT_SUBMODULE_DEPTH: 0
  GIT_SUBMODULE_STRATEGY: recursive
  # Temporary: separate clone path prevents clone-strategy jobs from erasing
  # fetch workspaces during transition. Remove once all projects use fetch.
  GIT_CLONE_PATH: $CI_BUILDS_DIR/fetch/$CI_RUNNER_SHORT_TOKEN/$CI_CONCURRENT_ID/$CI_PROJECT_PATH
  GIT_SUBMODULE_UPDATE_FLAGS: --jobs 4
  # Allow file:// protocol for nested submodules with relative paths
  # HAF's hive submodule uses relative paths that resolve to file:// URLs
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: protocol.file.allow
  GIT_CONFIG_VALUE_0: always
  # =============================================================================
  # Upstream Image Detection (No Submodules Required)
  # =============================================================================
  # HAF image is dynamically detected by find_haf_image job using
  # common-ci-configuration scripts. No manual updates needed - always uses
  # the latest built image from the HAF repo.
  #
  # Output variables (set by detect stage job):
  #   HAF_UPSTREAM_IMAGE, HAF_UPSTREAM_COMMIT, HAF_UPSTREAM_TAG
  # =============================================================================
  # HAF configuration
  DATA_CACHE_HAF_PREFIX: "/cache/replay_data_haf"
  # NFS cache configuration for sync data sharing across builders
  DATA_CACHE_NFS_PREFIX: "/nfs/ci-cache"
  BLOCK_LOG_SOURCE_DIR_5M: /blockchain/block_log_5m
  FF_NETWORK_PER_BUILD: 1
  PYTEST_NUMBER_OF_PROCESSES: 8
  BUILDER_IMAGE_TAG: "$TEST_HAF_IMAGE_TAG"
  BUILDER_IMAGE_PATH: "registry.gitlab.syncad.com/hive/haf/ci-base-image${BUILDER_IMAGE_TAG}"

  UPSTREAM_OVERRIDE_TAG: ef94c4dc7d20cfdc8b127ea384d6bbefc1f65b9d
include:
- template: Workflows/Branch-Pipelines.gitlab-ci.yml
# Common CI templates from common-ci-configuration
- project: 'hive/common-ci-configuration'
  ref: 0a1e1a9d53d6b1c8ae1bdc652e19740134a359b4
  file:
  - '/templates/test_jobs.gitlab-ci.yml'
  - '/templates/python_projects.gitlab-ci.yml'
  - '/templates/docker_image_jobs.gitlab-ci.yml'
  - '/templates/cache_cleanup.gitlab-ci.yml'
  - '/templates/npm_projects.gitlab-ci.yml'
  - '/templates/haf_data_preparation.gitlab-ci.yml'
  - '/templates/source_change_detection.gitlab-ci.yml'

default:
  hooks:
    pre_get_sources_script:
      # Clean corrupt git state left by cancelled pipelines (see GitLab #296638, #4600)
      # Wrapped in subshell to avoid changing working directory for subsequent git operations
    - |
      (
      cd "${CI_PROJECT_DIR:-/builds}" 2>/dev/null || exit 0
      echo "pre_get_sources: checking $(pwd) for corrupt git state"
      if [ -d ".git" ]; then
        # Remove stale lock files that block git operations
        find .git -name "*.lock" -delete 2>/dev/null || true

        # Check if main repo is corrupt - if so, remove .git to force fresh clone
        if ! git rev-parse HEAD >/dev/null 2>&1; then
          echo "pre_get_sources: main repository corrupt, forcing fresh clone"
          rm -rf .git
        else
          # Main repo OK - check and clean corrupt submodules
          # Check both the working dir and .git/modules/ since either can be corrupt
          if [ -f ".gitmodules" ]; then
            git config --file .gitmodules --get-regexp path 2>/dev/null | awk '{print $2}' | while read submod; do
              needs_clean=false
              [ -z "$submod" ] && continue
              # Check if submodule working directory exists but is corrupt
              if [ -d "$submod" ] && [ -f "$submod/.git" ]; then
                if ! git -C "$submod" rev-parse HEAD >/dev/null 2>&1; then
                  needs_clean=true
                fi
                # Also check if origin remote is valid (broken remotes cause fetch failures)
                if ! git -C "$submod" remote get-url origin >/dev/null 2>&1; then
                  echo "pre_get_sources: $submod has broken origin remote"
                  needs_clean=true
                fi
              fi
              # Check if .git/modules exists but is corrupt (even if working dir is gone)
              if [ -d ".git/modules/$submod" ]; then
                if ! git --git-dir=".git/modules/$submod" rev-parse HEAD >/dev/null 2>&1; then
                  echo "pre_get_sources: $submod corrupt (rev-parse failed)"
                  needs_clean=true
                fi
              fi
              if [ "$needs_clean" = true ]; then
                echo "pre_get_sources: cleaning corrupt submodule: $submod"
                rm -rf "$submod" ".git/modules/$submod"
              fi
            done
          fi
          echo "pre_get_sources: existing repo OK"
        fi
      else
        echo "pre_get_sources: no .git directory (fresh workspace)"
      fi
      )

.lint_job:
  extends: .job-defaults
  stage: lint
  variables:
    GIT_SUBMODULE_STRATEGY: none
  artifacts:
    name: lint-results
    when: always
  tags:
  - public-runner-docker

lint_bash_scripts:
  extends: .lint_job
  image: koalaman/shellcheck-alpine:latest
  before_script:
  - apk add xmlstarlet
  script:
  # Exclude .git and submodules (submodules may be stale from other jobs using fetch strategy)
  - find . -name .git -type d -prune -o -path ./submodules -prune -o -type f -name
    \*.sh -exec shellcheck -f checkstyle {} + | tee shellcheck-checkstyle-result.xml
  after_script:
  - xmlstarlet tr misc/checkstyle2junit.xslt shellcheck-checkstyle-result.xml > shellcheck-junit-result.xml
  artifacts:
    paths:
    - shellcheck-checkstyle-result.xml
    - shellcheck-junit-result.xml
    reports:
      junit: shellcheck-junit-result.xml

lint_sql_scripts:
  extends: .lint_job
  image:
    name: sqlfluff/sqlfluff:2.1.4
    entrypoint: [""]
  script:
  - sqlfluff lint --format yaml --write-output sql-lint.yaml --dialect postgres ||
    true
  - |
    if [ -f sql-lint.yaml ]; then
      echo "SQL lint results:"
      cat sql-lint.yaml
      # Check if there are any violations and exit with error code
      if grep -q "violations:" sql-lint.yaml && [ "$(grep -c "violations:" sql-lint.yaml)" -gt 0 ]; then
        echo "SQL linting failed with violations. See details above."
        exit 1
      fi
    fi
  artifacts:
    paths:
    - sql-lint.yaml

# =============================================================================
# Upstream Image Detection Jobs
# =============================================================================
# Automatically find the latest built images from upstream HAF repo by
# analyzing which commits changed source files. Uses .find_upstream_image template
# from common-ci-configuration.
#
# The job outputs variables with the HAF_UPSTREAM_ prefix:
#   HAF_UPSTREAM_IMAGE, HAF_UPSTREAM_COMMIT, HAF_UPSTREAM_TAG
# =============================================================================
find_haf_image:
  extends: .find_upstream_image
  stage: detect
  variables:
    UPSTREAM_REPO_URL: "https://gitlab.syncad.com/hive/haf.git"
    UPSTREAM_REGISTRY: "registry.gitlab.syncad.com/hive/haf"
    UPSTREAM_BRANCH: "develop"
    UPSTREAM_OUTPUT: "haf_image.env"
  before_script:
    # docker-builder image already has git, bash, and curl
    # Fetch source patterns from HAF's script (single source of truth)
  - |
    PATTERNS_URL="https://gitlab.syncad.com/hive/haf/-/raw/develop/scripts/ci-helpers/source-patterns.sh"
    echo "Fetching source patterns from: $PATTERNS_URL"
    if UPSTREAM_PATTERNS=$(curl -sf "$PATTERNS_URL" | sh); then
      echo "Loaded patterns: $UPSTREAM_PATTERNS"
      export UPSTREAM_PATTERNS
    else
      echo "ERROR: Could not fetch source-patterns.sh from HAF"
      exit 1
    fi
  script:
  - !reference [.find_upstream_image, script]
    # Rename UPSTREAM_* to HAF_UPSTREAM_* to avoid collisions with other upstream jobs
  - |
    if [ -f "$UPSTREAM_OUTPUT" ]; then
      sed -i 's/^UPSTREAM_/HAF_UPSTREAM_/' "$UPSTREAM_OUTPUT"
      echo "Renamed variables in $UPSTREAM_OUTPUT:"
      cat "$UPSTREAM_OUTPUT"
    fi
  artifacts:
    reports:
      dotenv: haf_image.env
    expire_in: 1 day
  tags:
  - public-runner-docker

# Note: prepare_haf_image is no longer needed - we use pre-built images from
# the HAF registry via find_haf_image job. The .prepare_haf_image template is
# still available from haf_data_preparation.gitlab-ci.yml but we don't use it.


build_images:
  extends: .docker_image_builder_job_template
  stage: build
  before_script:
  - !reference [.docker_image_builder_job_template, before_script]
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
  - |
    # Enable BuildKit for better caching
    export DOCKER_BUILDKIT=1
    echo "DOCKER_BUILDKIT enabled"
  script:
  - |
    # Export BuildKit for the script
    export DOCKER_BUILDKIT=1

    # Build and push images - script handles tagging
    # Tags with: short SHA (always) + latest (develop) + version (protected tags)
    $CI_PROJECT_DIR/scripts/build_images.sh --push
  tags:
  - public-runner-docker

# Publish to registry.hive.blog on protected tags only
# Uses pull/retag/push pattern - no rebuild
publish_images:
  extends: .docker_publish_job_template
  variables:
    # hivesense root + 3 subpath images
    PUBLISH_IMAGES: "hivesense postgrest-rewriter syncer pca"

sync:
  extends: .docker_image_builder_job_template
  stage: sync
  image: registry.gitlab.syncad.com/hive/haf_api_node/dind:1.27.11rc2
  # TODO: Fix sync test - currently fails because the external sync API returns
  # operations for blocks beyond the 1M test data. Options to fix:
  # 1. Create a CI-specific mock API endpoint
  # 2. Pre-cache hivesense database like HAF
  # 3. Expand test block_log to 1.3M+ blocks
  allow_failure: true
  needs:
  - job: find_haf_image
    artifacts: true
  - build_images
  variables:
    DOCKER_COMPOSE_VERSION: 2.27.1
    DATA_SOURCE: ${DATA_CACHE_HAF_PREFIX}_${HAF_UPSTREAM_COMMIT}
    POOL_DIR: ${CI_PROJECT_DIR}/${CI_JOB_ID}/
    DATADIR: ${POOL_DIR}/haf-datadir
    SHM_DIR: ${POOL_DIR}/haf-datadir/shared_memory
    HAF_DATA_DIRECTORY: ${DATADIR}
    HAF_SHM_DIRECTORY: ${SHM_DIR}
    BACKEND_VERSION: "$CI_COMMIT_SHORT_SHA"
    # Map HAF_UPSTREAM_* from find_haf_image to HAF_* for scripts
    HAF_COMMIT: "${HAF_UPSTREAM_COMMIT}"
    POSTGRES_ACCESS: postgresql://haf_admin@docker:5432/haf_block_log
    PUBLIC_HOSTNAME: "localhost"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 0 # prevent fatal: remote error: upload-pack: not our ref when recursively updating tags
  timeout: 1 hours
  before_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):login[collapsed=true]\r\e[0KLogging to Docker registry..."
    docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    echo -e "\e[0Ksection_end:$(date +%s):login\r\e[0K"
    echo -e "\e[0Ksection_start:$(date +%s):git[collapsed=true]\r\e[0KConfiguring Git..."
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    git config --global --add safe.directory "$CI_PROJECT_DIR/submodules/haf_api_node"
    git config --global --add safe.directory "$CI_PROJECT_DIR/submodules/hivemind"
    git submodule foreach --recursive 'git fetch --tags'
    echo -e "\e[0Ksection_end:$(date +%s):git\r\e[0K"
  - |
    # NFS fallback: Copy HAF data from NFS if local cache is missing
    echo -e "\e[0Ksection_start:$(date +%s):nfs_cache[collapsed=true]\r\e[0KChecking HAF data cache..."
    LOCAL_CACHE="${DATA_SOURCE}"
    NFS_CACHE="${DATA_CACHE_NFS_PREFIX}/haf/${HAF_UPSTREAM_COMMIT}"
    if [[ ! -d "${LOCAL_CACHE}/datadir" ]]; then
      echo "Local cache not found at ${LOCAL_CACHE}"
      if [[ -d "${NFS_CACHE}/datadir" ]]; then
        echo "Found NFS cache at ${NFS_CACHE}, copying..."
        mkdir -p "${LOCAL_CACHE}"
        cp -r "${NFS_CACHE}/datadir" "${LOCAL_CACHE}/"
        echo "NFS cache copy complete"
      else
        echo "WARNING: Neither local nor NFS cache found for HAF data"
      fi
    else
      echo "Local cache found at ${LOCAL_CACHE}"
    fi
    echo -e "\e[0Ksection_end:$(date +%s):nfs_cache\r\e[0K"
  script:
  - docker compose version
  - |
    echo -e "\e[0Ksection_start:$(date +%s):compose[collapsed=true]\r\e[0KStarting the test environment..."
    scripts/ci-helpers/start-ci-test-environment.sh --haf-data-directory=${POOL_DIR} --block-log-directory=${BLOCK_LOG_SOURCE_DIR_5M}
    echo -e "\e[0Ksection_end:$(date +%s):compose\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):wait[collapsed=true]\r\e[0KWaiting for Hivesense sync..."
    scripts/ci-helpers/wait-for-hivesense-startup.sh
    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):test[collapsed=true]\r\e[0KTest hivesense sync..."
    netstat -tuln
    tests/integration/api_node/hivesense_synced_api_node_test.sh
    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"

    echo -e "\e[0Ksection_start:$(date +%s):test[collapsed=true]\r\e[0KBenchmark hivesense sync..."
    tests/integration/api_node/benchmarks/api/benchmark.sh --workers=1 --loops=1
    echo -e "\e[0Ksection_end:$(date +%s):wait\r\e[0K"
  after_script:
  - |
    echo -e "\e[0Ksection_start:$(date +%s):compose2[collapsed=true]\r\e[0KStopping test environment..."

    ls -la $(pwd)
    OLDPWD=$(pwd)
    cd submodules/haf_api_node || exit 1
    docker compose logs --no-log-prefix haf > ${OLDPWD}/docker/haf.log
    docker compose logs --no-log-prefix haproxy > ${OLDPWD}/docker/haproxy.log
    docker compose logs --no-log-prefix hivesense-install-schema > ${OLDPWD}/docker/hivesense-install.log
    docker compose logs --no-log-prefix hivesense-sync > ${OLDPWD}/docker/hivesense-sync.log
    docker compose logs --no-log-prefix hivesense-postgrest > ${OLDPWD}/docker/hivesense-postgrest.log
    docker compose logs --no-log-prefix swagger > ${OLDPWD}/docker/hivesense-swagger.log
    docker compose logs --no-log-prefix hivesense-postgrest-rewriter > ${OLDPWD}/docker/hivesense-postgrest-rewriter.log
    docker compose logs --no-log-prefix hivesense-ollama > ${OLDPWD}/docker/hivesense-ollama.log
    cd "$OLDPWD" || exit 1

    # Create docker directory if it doesn't exist
    mkdir -p docker

    # Check if jmeter results exist and add them to the archive
    if [ -d "jmeter_results" ]; then
      echo "Adding JMeter benchmark results to container logs archive..."
      # Add jmeter results to the tar file
      tar -cf - $(pwd)/docker/*.log $(pwd)/jmeter_results | gzip > docker/container-logs.tar.gz
    else
      # Just include the logs if no jmeter results
      tar -cf - $(pwd)/docker/*.log | gzip > docker/container-logs.tar.gz
    fi



    # Manually remove the copy of the replay data to preserve disk space on the replay server
    sudo rm -rf ${POOL_DIR}

    echo -e "\e[0Ksection_end:$(date +%s):compose2\r\e[0K"
  artifacts:
    paths:
    - docker/container-logs.tar.gz
    expire_in: 1 week
    when: always
  tags:
  - data-cache-storage
  - fast
