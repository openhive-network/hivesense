rewrite ^/sync-settings /rpc/get_sync_settings break;
# endpoint for get /sync-settings (internal)

rewrite ^/embedding-updates /rpc/embedding_updates break;
# endpoint for get /embedding-updates (internal)

rewrite ^/authors/search /rpc/authors_search break;
# endpoint for get /authors/search

rewrite ^/posts/([^/]+)/([^/]+)/similar /rpc/posts_similar?author=$1&permlink=$2 break;
# endpoint for get /posts/{author}/{permlink}/similar

rewrite ^/similarpostsbypost /rpc/get_similar_posts_by_post break;
# endpoint for get /similarpostsbypost

rewrite ^/posts/by-ids /rpc/posts_by_ids break;
# endpoint for post /posts/by-ids

rewrite ^/posts/search /rpc/posts_search break;
# endpoint for get /posts/search

rewrite ^/similarposts /rpc/get_similar_posts break;
# endpoint for get /similarposts

rewrite ^/$ / break;
# endpoint for openapi spec itself

rewrite ^/(.*)$ /rpc/$1 break;
# default endpoint for everything else
