# Profile for hive/hivesense, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: hivesense

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/hivesense"
  id: 506

# AIDEV integrates into its own branch and hands it off to develop by merge
# request (`aidev handoff hivesense`: it opens the MR, starts the GitLab pipeline
# on aidev/integration and arms auto-merge), as in hive/HAfAH, hive/haf and
# hive/hivemind. `stable` is omitted, so `aidev release` never moves develop or
# master; develop -> master stays the project's own process.
branches:
  integration: "aidev/integration"
  handoff: "develop"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  # Built by .aidev/runtime/build.sh from .aidev/runtime/Dockerfile (its only input).
  image: "registry.gitlab.syncad.com/hive/hivesense/aidev-tests@sha256:a689331ce30a0f708f3b1c8ce2c333bf2c631de9c5a7c92937babea8215f45df"
  inputs: [".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# The service stack the slots that install hivesense start (aidev#9890): one empty
# HAF testnet database with HAfAH, reputation_tracker and hivemind installed by
# one-shot services, as docker/ci/compose.yml installs them, and nothing synced;
# plus CI's CPU Ollama with CI's model baked in (`ollama`) and the one-shot that
# puts that model's tokenizer into the HAF container (`tokenizer-copy`).
# The runtime container joins its network and reaches it as `haf`; the candidate's
# own SQL is installed into it by .aidev/run-checks.sh, so no hivesense image is
# built. Slots that only lint say `stack: false`. See .aidev/README.md.
sandbox:
  compose: .aidev/test-stack.compose.yml
  # One idle PostgreSQL 18, the install one-shots and a small CPU embedding model;
  # nothing replayed.
  resource_class: light
  services: [haf, haf-init, hafah-install, reputation-tracker-install, hivemind-install, ollama, tokenizer-copy, ready]
  readiness_timeout: 600
  env:
    HIVESENSE_TEST_DB_HOST: haf

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
#
# Lightweight first: lint (CI's shellcheck and sqlfluff), the python unit tests,
# the stack pins against CI's UPSTREAM_BRANCH, then install / reinstall of the
# candidate's SQL into the stack (through the install-lock wrapper, plus CI's #54
# events_id and lock-skip checks), embedding a few seeded posts with CI's models in
# full, slice and PCA configurations and checking the HNSW index and the search
# functions and endpoints on them, and a PostgREST smoke test. CI's `sync` job (a
# 1M-block HAF replay, hivemind sync and block processing), the image builds, the
# rebase rehearsal, the benchmarks and the AI effectiveness tests are not bound:
# GitLab CI gates them before a merge into develop; see .aidev/README.md.
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "shellcheck", "sqlfluff", "unit", "sql-registered", "stack-pins"]
    stack: false
    artifacts: ["test-results/quick/"]
  full:
    adapter: command
    args: [".aidev/run-checks.sh", "full", "shellcheck", "sqlfluff", "unit", "sql-registered", "stack-pins", "install", "events-id", "install-lock", "reinstall", "embed-search", "embed-slice", "embed-pca", "api-smoke"]
    artifacts: ["test-results/full/"]
  baseline:
    adapter: command
    args: [".aidev/run-checks.sh", "baseline", "install", "reinstall", "embed-search", "api-smoke"]
    artifacts: ["test-results/baseline/"]
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "shellcheck", "sqlfluff", "unit", "sql-registered", "stack-pins", "install", "events-id", "install-lock", "reinstall", "embed-search", "embed-slice", "embed-pca", "api-smoke"]
    artifacts: ["test-results/canary/"]
  # There is no coverage measurement for SQL; `coverage` runs the stackless checks
  # (AIDEV runs it in the post-implementation scan only). `static` and `system`
  # are left unbound: AIDEV runs neither for a project.
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "unit", "sql-registered"]
    stack: false
    artifacts: ["test-results/coverage/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
